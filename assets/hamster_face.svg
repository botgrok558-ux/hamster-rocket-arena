<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3b3fb6"/>
      <stop offset="0.55" stop-color="#1b1d6b"/>
      <stop offset="1" stop-color="#0a0b2e"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff3d5a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbb55"/>
      <stop offset="1" stop-color="#ec8a22"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#e2294b"/>
    </linearGradient>
  </defs>
  <g stroke="#170d33" stroke-linejoin="round" stroke-linecap="round"><g id="hamster">
